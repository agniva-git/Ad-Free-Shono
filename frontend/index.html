<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AdFreeShono</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2228%22>🎵</text></svg>">
</head>
<body>

  <div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🎵</div>
        <div class="brand-text">
          <h1>AdFreeShono</h1>
          <span class="brand-badge">₹0 / Month</span>
        </div>
      </div>

      <nav class="nav-group">
        <div class="nav-title">Library</div>
        <a class="nav-link active" data-view="home" onclick="window.appNavigate('home')">
          <span class="icon">🏠</span> Home
        </a>
        <a class="nav-link" data-view="songs" onclick="window.appNavigate('songs')">
          <span class="icon">🎵</span> All Songs
        </a>
        <a class="nav-link" data-view="artists" onclick="window.appNavigate('artists')">
          <span class="icon">🎤</span> Artists
        </a>
        <a class="nav-link" data-view="albums" onclick="window.appNavigate('albums')">
          <span class="icon">💿</span> Albums
        </a>
        <a class="nav-link" data-view="playlists" onclick="window.appNavigate('playlists')">
          <span class="icon">📋</span> Playlists
        </a>
        <a class="nav-link" data-view="favorites" onclick="window.appNavigate('favorites')">
          <span class="icon">💖</span> Liked Songs
        </a>
      </nav>

      <nav class="nav-group" style="margin-top: auto;">
        <div class="nav-title">Management</div>
        <a class="nav-link" data-view="upload" onclick="window.appNavigate('upload')">
          <span class="icon">📤</span> Upload & Scan
        </a>
      </nav>
    </aside>

    <!-- Main View -->
    <main class="main-wrapper">
      <header class="top-header">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search songs, artists, albums..." autocomplete="off">
        </div>
        <div class="header-stats">
          <div>Mode: <span style="color: var(--accent);">Local-First Cloud</span></div>
        </div>
      </header>

      <section class="content-view" id="content-area">
        <!-- Views dynamically injected here by app.js -->
      </section>
    </main>
  </div>

  <!-- Persistent Player Bar -->
  <footer class="player-bar">
    <div class="player-left">
      <div class="player-cover" id="player-cover-img">🎵</div>
      <div class="player-song-info">
        <div class="player-title" id="player-title">No track playing</div>
        <div class="player-artist" id="player-artist">Select a song to start streaming</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">🔀</button>
        <button class="ctrl-btn" id="prev-btn" title="Previous">⏮</button>
        <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Play/Pause">▶</button>
        <button class="ctrl-btn" id="next-btn" title="Next">⏭</button>
        <button class="ctrl-btn" id="repeat-btn" title="Repeat">🔁</button>
      </div>

      <div class="progress-container">
        <span class="time-label" id="current-time">0:00</span>
        <input type="range" class="slider" id="progress-slider" min="0" max="100" value="0" step="0.1">
        <span class="time-label" id="total-time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <div class="volume-container">
        <span style="font-size: 14px; color: var(--text-muted);">🔊</span>
        <input type="range" class="slider" id="volume-slider" min="0" max="1" value="0.8" step="0.01">
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav">
    <a class="mobile-nav-item active" data-view="home" onclick="window.appNavigate('home')">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>
    <a class="mobile-nav-item" data-view="songs" onclick="window.appNavigate('songs')">
      <span class="icon">🎵</span>
      <span>Songs</span>
    </a>
    <a class="mobile-nav-item" data-view="playlists" onclick="window.appNavigate('playlists')">
      <span class="icon">📋</span>
      <span>Playlists</span>
    </a>
    <a class="mobile-nav-item" data-view="favorites" onclick="window.appNavigate('favorites')">
      <span class="icon">💖</span>
      <span>Liked</span>
    </a>
    <a class="mobile-nav-item" data-view="upload" onclick="window.appNavigate('upload')">
      <span class="icon">📤</span>
      <span>Upload</span>
    </a>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
