<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>AdFreeShono</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">ADFREESHONO</div>
    <nav class="nav" id="nav">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/songs" data-route="songs">Songs</a>
      <a href="#/artists" data-route="artists">Artists</a>
      <a href="#/albums" data-route="albums">Albums</a>
      <a href="#/playlists" data-route="playlists">Playlists</a>
      <a href="#/liked" data-route="liked">Liked</a>
      <a href="#/upload" data-route="upload">Upload</a>
    </nav>
    <input type="search" id="search" placeholder="search..." autocomplete="off" aria-label="Search">
    <span id="status" role="status"></span>
    <button id="logout" data-action="logout" hidden>Logout</button>
  </header>

  <main id="view"></main>

  <footer class="deck">
    <div class="deck-art" id="art">NO ART</div>

    <div class="deck-main">
      <div class="label">NOW PLAYING</div>
      <div id="np-title">-- nothing loaded --</div>
      <div id="np-sub" class="dim">&nbsp;</div>
      <div class="deck-seek">
        <span id="t-cur">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span id="t-dur">0:00</span>
      </div>
    </div>

    <div class="deck-controls">
      <button id="b-prev" title="Previous" aria-label="Previous">|&lt;&lt;</button>
      <button id="b-play" title="Play / pause" aria-label="Play or pause">PLAY</button>
      <button id="b-next" title="Next" aria-label="Next">&gt;&gt;|</button>
      <button id="b-shuf" title="Shuffle">SHUF</button>
      <button id="b-rep" title="Repeat">REP:ALL</button>
      <label class="vol">VOL <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></label>
    </div>
  </footer>

  <dialog id="modal"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
